# Shared TLS settings for every HTTPS server block.
#
# The certificate is symlinked by scripts/10_ssl_wildcard.sh into
# /etc/ssl/shared so that a single wildcard certificate covers all vhosts.

ssl_certificate     /etc/ssl/shared/fullchain.pem;
ssl_certificate_key /etc/ssl/shared/privkey.pem;
ssl_trusted_certificate /etc/ssl/shared/chain.pem;
ssl_stapling on;
ssl_stapling_verify on;

# --- Security headers ---
# HSTS: 2 years, includeSubDomains, preload. Only enable `preload` once you
# are certain every subdomain is HTTPS-only — it is effectively irreversible.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(self), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;

# Do not leak the server version.
server_tokens off;
