# =============================================================================
# nginx front-end reverse proxy
# =============================================================================
# nginx terminates TLS and proxies to the upstream services on 127.0.0.1.
# Every upstream binds to the loopback interface, so nothing is directly
# reachable from the internet except through these server blocks.
# =============================================================================

user www-data;
worker_processes auto;
pid /run/nginx.pid;
worker_rlimit_nofile 8192;

events {
    worker_connections 2048;
    multi_accept on;
}

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    # The proxy_headers_hash warning appears when the upstream header set
    # grows; raise both values above the defaults (512 / 64) to silence it.
    proxy_headers_hash_max_size 1024;
    proxy_headers_hash_bucket_size 128;
    server_tokens off;
    client_max_body_size 64m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    send_timeout 30s;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- WebSocket upgrade map ---
    # Only send "Connection: upgrade" when the client actually asked for it;
    # sending it unconditionally breaks keep-alive on normal requests.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # --- Logging ---
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time '
                    'rid=$request_id ua_hash=$upstream_cache_status';

    # --- Gzip ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/wasm;

    # --- SSL defaults ---
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_ecdh_curve X25519:prime256v1:secp384r1;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 1.1.1.1 8.8.8.8 valid=300s;
    resolver_timeout 5s;

    # --- Rate limiting zones ---
    # The API is the endpoint that writes to the database and (eventually)
    # triggers LLM inference, so it is the one that needs the tightest limit.
    limit_req_zone $binary_remote_addr zone=api_zone:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=usage_zone:10m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_zone:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # --- Upstream connection pooling ---
    upstream api_upstream {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    upstream node_api_upstream {
        server 127.0.0.1:8000 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }
    upstream rag_upstream {
        server 127.0.0.1:8001 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }
    upstream streamlit_upstream {
        server 127.0.0.1:3001 max_fails=3 fail_timeout=30s;
        keepalive 4;
    }
    upstream webui_upstream {
        server 127.0.0.1:8085 max_fails=3 fail_timeout=30s;
        keepalive 8;
    }

    include /etc/nginx/conf.d/*.conf;
}
