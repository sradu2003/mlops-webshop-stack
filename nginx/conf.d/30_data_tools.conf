# =============================================================================
# Data tools & AI workspace
# =============================================================================

# --- streamlit: internal analytics dashboard --------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.xxx.com;
    include /etc/nginx/snippets/ssl-shared.conf;

    limit_conn conn_zone 10;

    location / {
        limit_req zone=general_zone burst=20 nodelay;
        proxy_pass http://streamlit_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }
}

# --- jupyterlab: data science workspace ------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jupyter.xxx.com;
    include /etc/nginx/snippets/ssl-shared.conf;

    limit_conn conn_zone 5;

    # JupyterLab is authenticated by its own token. The extra basic-auth
    # layer in front of it is a second factor for a code-execution surface.
    # Configure it with: htpasswd -B /etc/nginx/.htpasswd <user>
    # and enable the auth_basic block below.
    # auth_basic "Restricted";
    # auth_basic_user_file /etc/nginx/.htpasswd;

    location / {
        limit_req zone=general_zone burst=10 nodelay;
        proxy_pass http://127.0.0.1:8888;
        include /etc/nginx/snippets/proxy.conf;

        # Jupyter's XSRF check relies on these headers being forwarded.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
