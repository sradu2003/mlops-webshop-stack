# =============================================================================
# Application APIs
# =============================================================================
# These are the endpoints that write to the database and (via the RAG
# service) trigger LLM inference, so they carry the tightest rate limits.

# --- python-api: the platform API ------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.xxx.com;
    include /etc/nginx/snippets/ssl-shared.conf;

    limit_conn conn_zone 20;

    location / {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Authentication endpoints get a much tighter limit: 5 requests/minute
    # per IP. This is the primary defence against credential stuffing.
    location /api/auth/ {
        limit_req zone=auth_zone burst=5 nodelay;
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Telemetry ingestion: high volume, but it must never be able to
    # exhaust the API's database pool.
    location /api/usage/ {
        limit_req zone=usage_zone burst=120 nodelay;
        proxy_pass http://api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    # Prometheus scrapes the API directly on 127.0.0.1:3000 (not through
    # nginx), so /metrics is not exposed publicly here.
    location /metrics {
        deny all;
        return 404;
    }
}

# --- node-api --------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name node.xxx.com;
    include /etc/nginx/snippets/ssl-shared.conf;

    limit_conn conn_zone 20;

    location / {
        limit_req zone=api_zone burst=40 nodelay;
        proxy_pass http://node_api_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /metrics {
        deny all;
        return 404;
    }
}

# --- nextjs-rag ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rag.xxx.com;
    include /etc/nginx/snippets/ssl-shared.conf;

    limit_conn conn_zone 10;

    location / {
        # Inference is expensive; a low request rate protects the VPS.
        limit_req zone=general_zone burst=10 nodelay;
        proxy_pass http://rag_upstream;
        include /etc/nginx/snippets/proxy.conf;
    }

    location /api/metrics {
        deny all;
        return 404;
    }
}
