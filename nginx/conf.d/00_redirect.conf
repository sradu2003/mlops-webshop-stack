# =============================================================================
# HTTP -> HTTPS redirect + ACME challenge
# =============================================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # ACME http-01 fallback (the wildcard cert uses DNS-01, but keep this
    # harmless path alive in case a per-host cert is issued over http-01).
    location /.well-known/acme-challenge/ {
        root /var/www/html/_acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Reject the bare apex and unknown hosts explicitly so they do not fall
# through to the first server block.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    include /etc/nginx/snippets/ssl-shared.conf;

    return 444;
}
