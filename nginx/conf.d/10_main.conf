# =============================================================================
# Main site -> Apache / WordPress
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name xxx.com www.xxx.com;
    include /etc/nginx/snippets/ssl-shared.conf;

    root /var/www/html/xxx.com/public;
    index index.html index.php;

    # Static assets first.
    location ~* \.(?:css|js|mjpg|jpeg|png|gif|ico|svg|woff2?|webp|avif)$ {
        try_files $uri @apache;
        expires 7d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # Never cache the HTML shell.
    location / {
        try_files $uri @apache;
        add_header Cache-Control "no-store";
    }

    location @apache {
        proxy_pass http://127.0.0.1:8081;
        include /etc/nginx/snippets/proxy.conf;
    }
}
