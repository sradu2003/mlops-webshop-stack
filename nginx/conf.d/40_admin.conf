# =============================================================================
# Administration surfaces
# =============================================================================
# Everything in this file is high-risk: a code-execution or database-dump
# surface reachable from the public internet.
#
# SECURITY POLICY
#   * These vhosts are DISABLED by default. Enable one only after adding
#     an access-control layer (IP allowlist or basic auth).
#   * The `deny all` blocks below mean an unconfigured host returns 403
#     rather than exposing the service.
# =============================================================================

# --- phpMyAdmin -------------------------------------------------------------
# Reachable only from allow-listed IPs. Add your office/VPN ranges:
#   allow 203.0.113.0/24;
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pma.xxx.com;
    include /etc/nginx/snippets/ssl-shared.conf;

    location / {
        deny all;
        # allow 203.0.113.0/24;
        # allow 198.51.100.7;
        proxy_pass http://127.0.0.1:8084;
        include /etc/nginx/snippets/proxy.conf;
    }
}

# --- open-webui: the AI chat workspace -------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name webui.xxx.com;
    include /etc/nginx/snippets/ssl-shared.conf;

    limit_conn conn_zone 20;

    location / {
        limit_req zone=general_zone burst=40 nodelay;
        proxy_pass http://webui_upstream;
        include /etc/nginx/snippets/proxy.conf;

        # Open WebUI's own auth is the access control here. Optionally add
        # a second factor in front of it.
        # auth_basic "Restricted";
        # auth_basic_user_file /etc/nginx/.htpasswd;
    }
}

# --- listmonk: email campaigns ---------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mail.xxx.com;
    include /etc/nginx/snippets/ssl-shared.conf;

    location / {
        # listmonk has its own login; restrict by IP as well.
        deny all;
        # allow 203.0.113.0/24;
        proxy_pass http://127.0.0.1:9000;
        include /etc/nginx/snippets/proxy.conf;
    }
}

# --- grafana: dashboards ----------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name grafana.xxx.com;
    include /etc/nginx/snippets/ssl-shared.conf;

    location / {
        # Grafana has its own login. Restrict by IP for defence in depth.
        deny all;
        # allow 203.0.113.0/24;
        proxy_pass http://127.0.0.1:3030;
        include /etc/nginx/snippets/proxy.conf;
    }
}

