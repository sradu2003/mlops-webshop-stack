<VirtualHost 127.0.0.1:8083>
    ServerName  docs.xxx.com
    DocumentRoot /var/www/html/docs.xxx.com/public
    <Directory /var/www/html/docs.xxx.com/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on
    ErrorLog  ${APACHE_LOG_DIR}/docs_error.log
    CustomLog ${APACHE_LOG_DIR}/docs_access.log combined
</VirtualHost>
