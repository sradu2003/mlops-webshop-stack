# Main WordPress site - xxx.com
<VirtualHost 127.0.0.1:8081>
    ServerName  xxx.com
    ServerAlias www.xxx.com
    DocumentRoot /var/www/html/xxx.com/public
    <Directory /var/www/html/xxx.com/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Honor X-Forwarded-Proto from nginx
    SetEnvIf X-Forwarded-Proto "https" HTTPS=on

    ErrorLog  ${APACHE_LOG_DIR}/xxx.com_error.log
    CustomLog ${APACHE_LOG_DIR}/xxx.com_access.log combined
</VirtualHost>
