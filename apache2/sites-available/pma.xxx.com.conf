# Hardened phpMyAdmin - only reachable via nginx pma.xxx.com -> 127.0.0.1:8084
<VirtualHost 127.0.0.1:8084>
    ServerName pma.xxx.com
    DocumentRoot /usr/share/phpmyadmin

    <Directory /usr/share/phpmyadmin>
        Options SymLinksIfOwnerMatch
        AllowOverride All
        Require all granted

        <IfModule mod_php.c>
            php_admin_value upload_tmp_dir /var/lib/phpmyadmin/tmp
            php_admin_value open_basedir /usr/share/phpmyadmin/:/etc/phpmyadmin/:/var/lib/phpmyadmin/:/usr/share/php/
        </IfModule>
    </Directory>

    # Block setup script
    <Directory /usr/share/phpmyadmin/setup>
        Require all denied
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/pma_error.log
    CustomLog ${APACHE_LOG_DIR}/pma_access.log combined
</VirtualHost>
