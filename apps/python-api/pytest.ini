[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Put the service root (the directory holding the `app` package) on
# sys.path. Without this, a bare `pytest` cannot import `app.config`
# and every test errors at collection with
#   ModuleNotFoundError: No module named 'app'
# `python -m pytest` happens to work because it inserts the CWD — but
# that is an accident of invocation, not a guarantee. This line makes
# every invocation form work identically.
pythonpath = .
# The default run is the UNIT suite: it must not need a database.
# The integration suite is opt-in — run it with `pytest -m integration`.
# A command-line `-m` overrides the `-m` in addopts, so
#   pytest -q tests/integration/ -m integration
# still runs them.
addopts = -q --strict-markers -m "not integration"
markers =
    integration: requires a live PostgreSQL database (see tests/integration/)
filterwarnings =
    ignore::DeprecationWarning:passlib.*
